# On every push to main: test the backend, typecheck the mobile app's shared code via the website,
# build the website, install PHP packages, and publish the result to the `deploy` branch.
# cPanel pulls `deploy` (cron auto-update or "Deploy HEAD Commit"); it never needs Composer or Node.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, pdo_mysql, fileinfo, sodium
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Build website
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Production PHP packages
        working-directory: backend
        run: |
          rm -f .env
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Assemble deploy bundle
        run: |
          mkdir -p out/deploy
          rsync -a --exclude tests --exclude node_modules --exclude .env --exclude 'database/*.sqlite' \
            --exclude 'storage/logs/*.log' --exclude 'storage/framework/*/*' backend/ out/backend/
          cp -R deploy/. out/deploy/
          cp deploy/.cpanel.yml out/.cpanel.yml
          echo "Built from ${GITHUB_SHA} on $(date -u). Do not edit: this branch is generated by .github/workflows/deploy.yml." > out/README.md

      - name: Publish to deploy branch
        working-directory: out
        run: |
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          printf '!/backend/vendor\n' > .gitignore
          git add -A -f .
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
