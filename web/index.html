<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KushRewards SA – cannabis clubs and venues guide</title>
    <meta name="description" content="An information guide to cannabis clubs, lounges and venues in Roodepoort and the West Rand, for adults 18+. No sales, orders or deliveries." />
    <meta name="theme-color" content="#1d6842" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Righteous&family=Schibsted+Grotesk:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var m = localStorage.getItem("kr-theme-mode") || "auto";
        var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
